name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test ReeveCore package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test --package-path Packages/ReeveCore

  app:
    name: Build app (iOS + macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build macOS
        run: |
          xcodebuild build \
            -project Reeve.xcodeproj \
            -scheme Reeve \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build iOS Simulator
        run: |
          xcodebuild build \
            -project Reeve.xcodeproj \
            -scheme Reeve \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
